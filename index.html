/* Topic-aware coding problem engine. Every language/topic gets its own bank and
   every difficulty has separate exercises. Existing hand-written problems are
   preserved and supplemented when a topic has fewer problems. */
function codeDifficultyName(v){return ['Easy','Medium','Hard'].includes(v)?v:'Easy'}
function topicFamily(topic){
  const t=String(topic||'').toLowerCase();
  if(/function|method|lambda|closure|delegate/.test(t))return 'functions';
  if(/variable|type|mutability|constant|literal/.test(t))return 'variables';
  if(/input|output|io|console/.test(t))return 'io';
  if(/operator/.test(t))return 'operators';
  if(/condition|if|branch/.test(t))return 'conditions';
  if(/loop|iteration|for|while/.test(t))return 'loops';
  if(/array|vector|list|slice|tuple/.test(t))return 'arrays';
  if(/string|regex|text/.test(t))return 'strings';
  if(/pointer|reference|ownership|borrow/.test(t))return 'pointers';
  if(/class|object|encapsulation|inheritance|polymorphism|abstraction/.test(t))return 'oop';
  if(/recursion|backtracking/.test(t))return 'recursion';
  if(/stack|queue|deque/.test(t))return 'stackqueue';
  if(/tree|bst|avl|heap|trie/.test(t))return 'trees';
  if(/graph|bfs|dfs|shortest|topological/.test(t))return 'graphs';
  if(/sort|search|binary search/.test(t))return 'algorithms';
  if(/sql|select|where|join|aggregate|subquer|window|cte|index|transaction|normaliz|dbms|relational/.test(t))return 'sql';
  if(/html|css|dom|web|responsive|semantic|form|accessibility|flexbox|grid|animation/.test(t))return 'web';
  if(/file|stream|serialization|json|csv/.test(t))return 'files';
  if(/exception|error|debug/.test(t))return 'errors';
  if(/thread|async|await|concurr|goroutine|coroutine|channel|mutex/.test(t))return 'concurrency';
  if(/memory|allocation|garbage|smart pointer/.test(t))return 'memory';
  if(/package|module|namespace|import|composer|npm|cargo/.test(t))return 'modules';
  if(/testing|pytest|unit test/.test(t))return 'testing';
  if(/api|http|network|fetch|rest/.test(t))return 'api';
  if(/security|crypt|cyber/.test(t))return 'security';
  return 'topic';
}
function languageHint(lang){
  const h={C:'C function/program syntax', 'C++':'C++ syntax and STL where useful', Java:'Java syntax and standard library', Python:'Python syntax and standard library', JavaScript:'modern JavaScript syntax', 'C#':'C# syntax and .NET library', PHP:'PHP syntax', SQL:'standard SQL', Go:'Go syntax and standard library', Rust:'Rust syntax and ownership rules', Kotlin:'Kotlin syntax and standard library', 'HTML/CSS':'HTML/CSS and JavaScript when interaction is required'};
  return h[lang]||lang+' syntax';
}

function getTopicProblemBank(lang,topic,difficulty){
  const d=codeDifficultyName(difficulty), list=codeProblems[lang]||[];
  const hand=list.filter(p=>String(p.topic||'').trim().toLowerCase()===String(topic||'').trim().toLowerCase() && String(p.difficulty||'').toLowerCase()===d.toLowerCase());
  const generated=generatedTopicProblems(lang,topic,d).filter(g=>!hand.some(p=>p.title===g.title));
  return [...hand,...generated];
}

  const idx=Math.max(0,Math.min(state.codeIndex||0,list.length-1));

async function submitCode(){saveCodeDraft();let r=document.getElementById('codeResult');if(!r)return;r.className='codeResult';r.textContent='Submitting against test suite…';try{let p=getCodeProblem(state.codeLang,state.codeTopic);let res=await fetch('/api/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({language:state.codeLang,code:state.codeDraft,input:state.stdin||'',problem:p})});if(!res.ok)throw new Error('Submission service unavailable');let d=await res.json();r.className=d.passed?'codeResult good':'codeResult bad';r.textContent=d.passed?`✓ Accepted — ${d.passedTests}/${d.totalTests} tests passed.`:`✕ ${d.passedTests||0}/${d.totalTests||p.tests.length} tests passed. ${d.message||'Review failing cases.'}`;let t=document.getElementById('runTests');if(t)t.textContent=`Tests ${d.passedTests||0}/${d.totalTests||p.tests.length}`;}catch(e){r.className='codeResult bad';r.textContent='Submission backend is not configured. Add a secure judge service before enabling real untrusted execution.'}}
function resetCode(){state.codeDraft='';let e=document.getElementById('codeArea');if(e)e.value=starter(state.codeLang,state.codeTopic);let r=document.getElementById('codeResult');if(r){r.className='codeResult';r.textContent='Reset. Ready for your solution.'}}

function aiPanel(){return `<section id="aiPanel" class="aiPanel glass" aria-label="AI coding tutor"><div class="aiHead"><div><b>train-to-code AI</b><div class="muted" style="font-size:11px">Coding tutor • debugging • concepts • interview prep</div></div><button class="smallBtn" onclick="closeAI()">×</button></div><div id="aiMessages" class="aiMessages"><div class="aiMsg assistant">Hi! I’m your coding tutor. Ask me anything — explain a concept, debug your code, compare approaches, review complexity, or walk through a problem step by step.</div></div><div id="aiStatus" class="aiStatus">Ready</div><div class="aiComposer"><textarea id="aiInput" placeholder="Ask anything about coding…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAI()}"></textarea><button class="btn" onclick="sendAI()">Send</button></div></section>`}
function openAI(prefill=''){const p=document.getElementById('aiPanel');if(!p){render();return openAI(prefill)}p.classList.add('show');if(prefill){document.getElementById('aiInput').value=prefill}document.getElementById('aiInput').focus()}
function closeAI(){document.getElementById('aiPanel')?.classList.remove('show')}
function addAI(role,text){const box=document.getElementById('aiMessages');if(!box)return;const d=document.createElement('div');d.className='aiMsg '+role;d.textContent=text;box.appendChild(d);box.scrollTop=box.scrollHeight}
async function sendAI(){const input=document.getElementById('aiInput');if(!input||!input.value.trim())return;const text=input.value.trim();input.value='';addAI('user',text);const status=document.getElementById('aiStatus');if(status)status.textContent='Thinking…';try{const p=getCodeProblem(state.codeLang,state.codeTopic);const res=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:[...document.querySelectorAll('#aiMessages .aiMsg')].map(x=>({role:x.classList.contains('user')?'user':'assistant',content:x.textContent})),context:{language:state.codeLang,topic:state.codeTopic,problem:p,code:state.codeDraft||document.getElementById('codeArea')?.value||'',stdin:state.stdin||''}})});if(!res.ok)throw new Error('AI service unavailable');const d=await res.json();addAI('assistant',d.text||'I could not generate a response.');if(status)status.textContent='Ready'}catch(e){addAI('assistant','The AI backend is not configured yet. Connect the /api/chat route to your model provider; the chatbot UI, conversation state and coding context are already wired.');if(status)status.textContent='Backend not configured'}}
function setLang(v){state.lang=v;render()} function setCodeLang(v){if(!curriculum[v])return;state.codeLang=v;state.codeTopic=curriculum[v][0];state.codeDifficulty='Easy';state.codeIndex=0;state.codeDraft='';state.stdin='';render()} function setCodeTopic(v){state.codeTopic=v;state.codeIndex=0;state.codeDraft='';state.stdin='';render()}
function practice(type){let arr=subjects[type]||subjects['Aptitude'];return `<div class="sectionHead"><div><div class="eyebrow">${type.toUpperCase()}</div><h1>${type==='Aptitude'?'Placement Aptitude':'Practice every topic'}</h1><p class="muted">${arr.length} topic areas. Select any topic independently. Every quiz opens instructions before the first question.</p></div><button class="btn" onclick="startQuiz('${type}')">25-Question Mock →</button></div><div class="searchBox glass"><input value="${esc(state.search)}" oninput="state.search=this.value;render()" placeholder="Search ${type} topics..."></div><div class="topicGrid">${filter(arr).map((x,i)=>`<article class="topicCard glass"><span class="topicNo">${String(i+1).padStart(2,'0')}</span><h3>${esc(x)}</h3><p>Concepts • formulas • examples • placement practice</p><button class="btn secondary" onclick="startTopic('${esc(type)}','${esc(x)}')">Start Quiz →</button></article>`).join('')}</div>`}

function buildTopicQuestions(type,topic){
  const t=String(topic||'').trim(); const lo=t.toLowerCase(); const out=[];
  const add=(q,opts,c,e)=>out.push([q,opts,c,e]);
  if(type==='Aptitude'){
    for(let i=0;i<25;i++){
      const a=i+2;
      if(/percent/.test(lo)){let price=400+i*40,rate=5+(i%6)*5,sp=price*(100-rate)/100;add(`A product costs ₹${price}. A ${rate}% discount is offered. What is the selling price?`,[`₹${sp}`,`₹${price-rate}`,`₹${price+rate}`,`₹${price}`],0,`${rate}% of ₹${price} is ₹${price*rate/100}, so the selling price is ₹${sp}.`)}
      else if(/profit|loss/.test(lo)){let cp=500+i*25,p=10+(i%5)*5,sp=cp*(100+p)/100;add(`An article costs ₹${cp} and is sold at a ${p}% profit. What is the selling price?`,[`₹${sp}`,`₹${cp+p}`,`₹${cp-p}`,`₹${cp}`],0,`Selling price = cost price × (100+profit%)/100 = ₹${sp}.`)}
      else if(/ratio|proportion/.test(lo)){let r1=2+(i%5),r2=3+(i%4),base=r1*(5+i%5),ans=r2*(5+i%5);add(`A:B = ${r1}:${r2}. If A = ${base}, what is B?`,[String(ans),String(ans+5),String(ans-5),String(base+r2)],0,`One ratio part is ${base}/${r1}; multiplying by ${r2} gives ${ans}.`)}
      else if(/average/.test(lo)){let x=10+i,y=20+i,z=30+i;let av=(x+y+z)/3;add(`What is the average of ${x}, ${y} and ${z}?`,[String(av),String(av+1),String(av-1),String(av+2)],0,`(${x}+${y}+${z}) ÷ 3 = ${av}.`)}
      else if(/age/.test(lo)){let older=20+i,younger=older-4;add(`Ravi is ${older} years old and is 4 years older than Arun. How old is Arun?`,[String(younger),String(older-2),String(older+4),String(younger+2)],0,`Arun's age = ${older} − 4 = ${younger}.`)}
      else if(/time & work|work & wages/.test(lo)){let days=5+(i%10);add(`A worker completes a job in ${days} days at a constant rate. What fraction of the job is completed per day?`,[`1/${days}`,`1/${days+1}`,`1/${days-1}`,`${days}/1`],0,`One complete job divided equally over ${days} days gives 1/${days} per day.`)}
      else if(/speed|distance|train|boat/.test(lo)){let time=2+(i%5),speed=30+i*5,dist=speed*time;add(`A vehicle travels at ${speed} km/h for ${time} hours. What distance does it cover?`,[`${dist} km`,`${dist+speed} km`,`${dist-time} km`,`${speed/time} km`],0,`Distance = speed × time = ${speed} × ${time} = ${dist} km.`)}
      else if(/simple interest/.test(lo)){let p=1000+i*200,r=5+(i%4)*5,y=1+(i%3),si=p*r*y/100;add(`Find the simple interest on ₹${p} at ${r}% per year for ${y} year(s).`,[`₹${si}`,`₹${si+p}`,`₹${p*r/100}`,`₹${si+100}`],0,`SI = P × R × T ÷ 100 = ₹${si}.`)}
      else if(/compound interest/.test(lo)){let p=1000,r=10,y=2,amt=p*Math.pow(1+r/100,y),ci=amt-p;add(`What is the compound interest on ₹${p} at ${r}% per year for ${y} years?`,[`₹${ci}`,`₹${p*r*y/100}`,`₹${ci+100}`,`₹${ci+200}`],0,`Amount = ₹${p} × 1.1² = ₹${amt}; compound interest = ₹${ci}.`)}
      else if(/permutation|arrangement/.test(lo)){let n=3+(i%5),f=Array.from({length:n},(_,k)=>k+1).reduce((x,v)=>x*v,1);add(`How many arrangements can be made from ${n} distinct objects?`,[String(f),String(f+n),String(f-n),String(n*n)],0,`${n}! = ${f}.`)}
      else if(/probability/.test(lo)){let favorable=1+(i%4),total=4+(i%4),g=(x,y)=>{while(y){[x,y]=[y,x%y]}return x},d=g(favorable,total);add(`A random outcome has ${favorable} favorable results out of ${total} equally likely results. What is the probability?`,[`${favorable/d}/${total/d}`,`1/${total}`,`${total}/${favorable}`,`${favorable}/${total+1}`],0,`Probability = favorable outcomes ÷ total outcomes = ${favorable}/${total} = ${favorable/d}/${total/d}.`)}
      else if(/quadratic|linear equation|algebra/.test(lo)){let x=2+(i%9),b=3+(i%5),c=x+b;add(`If x + ${b} = ${c}, what is x?`,[String(x),String(x+1),String(x-1),String(c)],0,`Subtract ${b} from both sides: x = ${c} − ${b} = ${x}.`)}
      else if(/hcf/.test(lo)){let x=12+i,y=18+i*2,g=(a,b)=>{while(b)[a,b]=[b,a%b];return a},ans=g(x,y);add(`Find the HCF of ${x} and ${y}.`,[String(ans),String(ans+1),String(ans+2),String(ans+3)],0,`The greatest common factor of ${x} and ${y} is ${ans}.`)}
      else if(/lcm/.test(lo)){let x=4+(i%5),y=6+(i%4),g=(a,b)=>{while(b)[a,b]=[b,a%b];return a},ans=x*y/g(x,y);add(`Find the LCM of ${x} and ${y}.`,[String(ans),String(ans+x),String(ans+y),String(ans-1)],0,`LCM(${x}, ${y}) = ${ans}.`)}
      else if(/number system|divisibility/.test(lo)){let n=90+i*9;add(`Which number is divisible by ${3+(i%3)}?`,[String(n),String(n+1),String(n+2),String(n+4)],0,`${n} is divisible by ${3+(i%3)}.`)}
      else if(/coordinate/.test(lo)){let x=3+i%5,y=4+i%4;add(`What is the distance of (${x}, ${y}) from the origin?`,[`${Math.sqrt(x*x+y*y).toFixed(2)}`,`${x+y}`,`${x*y}`,`${Math.abs(x-y)}`],0,`Distance = √(${x}² + ${y}²) = ${Math.sqrt(x*x+y*y).toFixed(2)}.`)}
      else if(/geometry|mensuration/.test(lo)){let side=4+(i%7),area=side*side;add(`What is the area of a square with side ${side} cm?`,[`${area} cm²`,`${side*4} cm²`,`${area+side} cm²`,`${side*2} cm²`],0,`Area = side² = ${side}² = ${area} cm².`)}
      else if(/clock/.test(lo)){let h=1+(i%11);add(`At ${h}:00, what is the angle between the hour and minute hands?`,[`${h*30}°`,`${h*15}°`,`${h*10}°`,`90°`],0,`Each hour mark represents 30°, so the angle at ${h}:00 is ${h*30}°.`)}
      else if(/decimal|fraction/.test(lo)){let n=12+i,d=3+(i%4),v=(n/d).toFixed(2);add(`What is ${n} ÷ ${d} as a decimal rounded to two places?`,[v,(n/d+1).toFixed(2),(n/d-1).toFixed(2),(n+d).toFixed(2)],0,`${n} ÷ ${d} = ${v} when rounded to two decimal places.`)}
      else if(/simplification/.test(lo)){let a=8+i,b=2+(i%4),c=3+(i%5);add(`Simplify: ${a} + ${b} × ${c}.`,[String(a+b*c),String((a+b)*c),String(a+b+c),String(a*b+c)],0,`Multiplication comes first: ${b} × ${c} = ${b*c}; then ${a} + ${b*c} = ${a+b*c}.`)}
      else if(/discount/.test(lo)){let mp=500+i*25,r=5+(i%5)*5,sp=mp*(100-r)/100;add(`An item marked ₹${mp} gets a ${r}% discount. What is the selling price?`,[`₹${sp}`,`₹${mp+r}`,`₹${mp-r}`,`₹${mp}`],0,`${r}% of ₹${mp} is ₹${mp*r/100}, leaving ₹${sp}.`)}
      else if(/partnership/.test(lo)){let a=2+(i%4),b=3+(i%5),tprofit=1000+i*100,ans=tprofit*a/(a+b);add(`A and B invest in the ratio ${a}:${b}. If profit is ₹${tprofit}, what is A's share?`,[`₹${ans}`,`₹${tprofit-ans}`,`₹${ans+b}`,`₹${tprofit/a}`],0,`A's share = ${a}/${a+b} × ₹${tprofit} = ₹${ans}.`)}
      else if(/pipes|cistern/.test(lo)){let days=4+(i%6);add(`A pipe fills a tank in ${days} hours. What fraction of the tank does it fill per hour?`,[`1/${days}`,`1/${days+1}`,`1/${days-1}`,`${days}/1`],0,`The hourly rate is the reciprocal of the filling time: 1/${days}.`)}
      else if(/train/.test(lo)){let s=40+(i%5)*10,t=3+(i%4),len=100+i*10,dist=s*t;add(`A ${len} m train travels at ${s} km/h for ${t} seconds. Which distance calculation is correct in metres?`,[`${(s*1000/3600*t).toFixed(2)} m`,`${dist} m`,`${s*t} m`,`${len+s} m`],0,`Convert ${s} km/h to m/s and multiply by ${t} seconds.`)}
      else if(/boats & streams/.test(lo)){let us=10+(i%5),stream=2+(i%3);add(`A boat moves at ${us} km/h in still water and the stream is ${stream} km/h. What is downstream speed?`,[`${us+stream} km/h`,`${us-stream} km/h`,`${us*stream} km/h`,`${us} km/h`],0,`Downstream speed = still-water speed + stream speed = ${us+stream} km/h.`)}
      else if(/quadratic/.test(lo)){let r=2+(i%6);add(`Which value is a root of x² − ${2*r}x + ${r*r} = 0?`,[String(r),String(r+1),String(r-1),String(2*r)],0,`The expression is (x − ${r})², so x = ${r}.`)}
      else if(/mensuration/.test(lo)){let l=5+(i%7),w=3+(i%5),area=l*w;add(`Find the area of a rectangle ${l} cm long and ${w} cm wide.`,[`${area} cm²`,`${2*(l+w)} cm²`,`${l+w} cm²`,`${area+l} cm²`],0,`Area = length × width = ${l} × ${w} = ${area} cm².`)}
      else if(/mixtures|alligation/.test(lo)){let a=2+(i%4),b=3+(i%4);add(`A mixture has components in ratio ${a}:${b}. What fraction is the first component?`,[`${a}/${a+b}`,`${b}/${a+b}`,`${a}/${b}`,`1/${a+b}`],0,`The first component occupies ${a} of ${a+b} total parts.`)}
      else if(/progression/.test(lo)){let first=3+i%5,d=2+i%3;add(`What is the next term of the arithmetic progression ${first}, ${first+d}, ${first+2*d}, ${first+3*d}, ?`,[String(first+4*d),String(first+3*d),String(first+5*d),String(first+d)],0,`An arithmetic progression adds the common difference ${d}; the next term is ${first+4*d}.`)}
      else if(/surds|indices/.test(lo)){let base=2+(i%4),exp=2+(i%3);add(`What is ${base}^${exp}?`,[String(Math.pow(base,exp)),String(base*exp),String(Math.pow(base,exp-1)),String(Math.pow(base+1,exp))],0,`${base} raised to ${exp} equals ${Math.pow(base,exp)}.`)}
      else if(/logarithm/.test(lo)){let base=2+(i%3),pow=2+(i%3),value=Math.pow(base,pow);add(`What is log base ${base} of ${value}?`,[String(pow),String(base),String(value),String(pow+1)],0,`${base}^${pow} = ${value}, so the logarithm is ${pow}.`)}
      else if(/data interpretation|tables|bar graph|pie chart|line graph|caselet/.test(lo)){let jan=20+i,apr=jan+30;add(`A data table records ${jan} units in January and ${apr} in April. What is the increase?`,[String(apr-jan),String(apr+jan),String(apr-jan+10),String(jan-apr)],0,`Increase = April − January = ${apr} − ${jan} = ${apr-jan}.`)}
      else if(/data sufficiency/.test(lo)){let n=10+i;add(`Is x = ${n} uniquely determined if statement 1 says x > ${n-1} and statement 2 says x < ${n+1}, with x an integer?`,['Yes','No','Only statement 1','Only statement 2'],0,'Together the two statements restrict integer x to exactly one value.')} 
      else if(/calendar/.test(lo)){let days=7+(i%5),names=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],ans=names[days%7];add(`If today is Monday, what day will it be after ${days} days?`,[ans,names[(days+1)%7],names[(days+2)%7],names[(days+3)%7]],0,'Calendar calculations use the remainder after dividing the number of days by 7.')} 
      else {let n=20+i;add(`In ${t}, which statement best describes the skill being tested?`,[`Applying ${t} concepts`,`Ignoring ${t} concepts`,`Replacing ${t} with unrelated code`,`Avoiding ${t} calculations`],0,`${t} questions require applying concepts from the selected topic.`)}
    }
  } else if(type==='Verbal' || type==='Reasoning' || type==='GK'){
    for(let i=0;i<25;i++){
      if(/synonym/.test(lo)){let pairs=[['brief','concise','lengthy','fragile'],['rapid','quick','slow','narrow'],['assist','help','hinder','ignore'],['accurate','precise','wrong','vague']];let p=pairs[i%pairs.length];add(`Choose the synonym of “${p[0]}”.`,[p[1],p[2],p[3],['ancient','empty','rough','silent'][i%4]],0,`${p[1]} has the same or nearest meaning as ${p[0]}.`)}
      else if(/antonym/.test(lo)){let pairs=[['expand','contract','enlarge','extend'],['ancient','modern','historic','old'],['scarce','abundant','rare','limited'],['accept','reject','receive','allow']];let p=pairs[i%pairs.length];add(`Choose the antonym of “${p[0]}”.`,[p[1],p[2],p[3],'continue'],0,`${p[1]} expresses the opposite meaning of ${p[0]}.`)}
      else if(/article/.test(lo)){let word=['umbrella','book','hour','university'][i%4],ans=/^[aeiou]/i.test(word)?'an':'a';add(`Choose the correct article: She bought ___ ${word}.`,[ans,ans==='a'?'an':'a','the','no article'],0,`The correct article before ${word} is ${ans}.`)}
      else if(/preposition/.test(lo)){let items=[['good ___ mathematics','at'],['interested ___ science','in'],['depend ___ you','on'],['arrived ___ noon','at']];let p=items[i%items.length];add(`Choose the correct preposition: ${p[0]}.`,[p[1],'on','for','to'],0,`The standard expression uses “${p[1]}” in this sentence.`)}
      else if(/tense/.test(lo)){add(`Choose the correct tense: By next year, she ___ the course.`,['will have completed','completed','completes','is complete'],0,'The future perfect describes completion before a future time.')}
      else if(/subject verb|agreement/.test(lo)){add(`Neither the manager nor the employees ___ available.`,['were','was','is','be'],0,'The verb agrees with the nearer plural subject employees.')}
      else if(/active|passive/.test(lo)){add(`Choose the passive form of “The team completed the task.”`,['The task was completed by the team.','The task completed the team.','The team was completed by the task.','The task is completing the team.'],0,'The object becomes the passive subject and completed becomes was completed.')}
      else if(/direct|indirect|speech/.test(lo)){add(`Choose the correct indirect speech: Ravi said, “I am tired.”`,['Ravi said that he was tired.','Ravi said that I am tired.','Ravi says he tired.','Ravi said that he is tiring.'],0,'The pronoun changes to he and the present tense backshifts to was.')}
      else if(/error|correction|improvement/.test(lo)){add(`Identify the incorrect part: “Each of the players have a locker.”`,['Each','of the players','have','a locker'],2,'Each is singular, so the verb should be has.')}
      else if(/one word/.test(lo)){let data=[['one who writes dictionaries','lexicographer','biographer','cartographer','typist'],['one who loves books','bibliophile','bibliographer','librarian','publisher'],['one who cannot read or write','illiterate','immature','illegible','inactive'],['one who speaks many languages','polyglot','monolingual','orator','translator']];let d=data[i%data.length];add(`Choose the one-word substitution for “${d[0]}”.`,d.slice(1),0,`${d[1]} is the standard one-word substitution.`)}
      else if(/idiom/.test(lo)){let data=[['break the ice','start a conversation','end a meeting','avoid people','create trouble'],['hit the nail on the head','identify exactly','miss a point','work slowly','change a plan'],['once in a blue moon','very rarely','every day','very loudly','at noon'],['piece of cake','very easy','very expensive','very large','very late']];let d=data[i%data.length];add(`What does the idiom “${d[0]}” mean?`,d.slice(1),0,`${d[1]} matches the standard meaning of the idiom.`)}
      else if(/sentence completion|fill in/.test(lo)){let data=[['Although it was raining, we ___ the match.','continued'],['She studied hard, so she ___ the exam.','passed'],['If I had known, I ___ earlier.','would have come'],['The manager asked us to ___ the report.','review']];let d=data[i%data.length];add(`Complete the sentence: ${d[0]}`,[d[1],'stopped','ignored','forgot'],0,`${d[1]} makes the sentence grammatically and logically complete.`)}
      else if(/active & passive/.test(lo)){add(`Change to passive voice: “The team completed the project.”`,['The project was completed by the team.','The project completed the team.','The team was completed by the project.','The project is completing the team.'],0,'The object becomes the subject and the past tense becomes the passive form.')} 
      else if(/direct & indirect/.test(lo)){add(`Change to indirect speech: Ravi said, “I am tired.”`,['Ravi said that he was tired.','Ravi says I am tired.','Ravi said that I am tired.','Ravi told that I was tired.'],0,'The reporting structure changes the first-person pronoun and present tense appropriately.')} 
      else if(/para jumble/.test(lo)){add(`Choose the best opening sentence for a paragraph about regular exercise.`,['Regular exercise improves physical and mental well-being.','Therefore, this habit should be ignored.','However, yesterday was rainy.','For example, a blue shirt is comfortable.'],0,'A topic sentence introducing the subject is the natural paragraph opening.')} 
      else if(/reading comprehension|cloze/.test(lo)){add(`Read: “Water is essential for life and supports agriculture, industry and ecosystems.” What is the main idea?`,['Water is essential across many areas of life.','Water is used only in agriculture.','Industry does not use water.','Ecosystems do not need water.'],0,'The sentence explicitly connects water with life, agriculture, industry and ecosystems.')} 
      else if(/critical reasoning/.test(lo)){add(`A company says flexible hours improve productivity because employees can work when they are most focused. Which assumption supports the claim?`,['Employees use flexible hours during periods when they can focus better.','Employees never work remotely.','All jobs require identical schedules.','Productivity cannot be measured.'],0,'The claim depends on employees actually using the flexibility to work during productive periods.')} 
      else if(/word usage|vocabulary/.test(lo)){let data=[['affect','The weather may affect travel.','The weather may effect travel.','The weather may affected travel.','The weather may affecting travel.'],['principal','The school principal addressed the students.','The school principle addressed the students.','The school principally addressed the students.','The school principals addressed the student.'],['complement','The blue tie complements the shirt.','The blue tie compliments the shirt.','The blue tie complementing the shirt.','The blue tie complemented shirt.']];let d=data[i%data.length];add(`Choose the sentence using “${d[0]}” correctly.`,d.slice(1),0,`The first sentence uses ${d[0]} in its standard grammatical meaning.`)}
      else if(/analogy/.test(lo)){add(`Choose the pair with the same relationship as Bird : Nest.`,['Bee : Hive','Dog : Bark','Fish : Water','Horse : Grass'],0,'A nest is a dwelling associated with a bird; a hive is associated with a bee.')} 
      else if(/coding decoding/.test(lo)){let c=String.fromCharCode(65+(i%20)),d=String.fromCharCode(c.charCodeAt(0)+1);add(`If each letter is shifted one position forward, how is ${c} coded?`,[d,c,String.fromCharCode(c.charCodeAt(0)+2),String.fromCharCode(c.charCodeAt(0)-1)],0,`Shifting ${c} one position forward gives ${d}.`)}
      else if(/blood relation/.test(lo)){add(`Ravi is the brother of Sita. Sita is the mother of Arun. How is Ravi related to Arun?`,['Uncle','Father','Brother','Grandfather'],0,'Ravi is the brother of Arun’s mother, so he is Arun’s uncle.')}
      else if(/direction/.test(lo)){let dirs=[['east','west'],['north','south'],['west','east'],['south','north']];let p=dirs[i%4];add(`A person faces ${p[0]} and turns right twice. Which direction does the person face?`,[p[1],p[0],'north','south'],0,`Two right turns reverse the original direction, giving ${p[1]}.`)}
      else if(/series/.test(lo)){let n=2+i;add(`Find the next term: ${n}, ${n+2}, ${n+4}, ${n+6}, ?`,[String(n+8),String(n+7),String(n+10),String(n+6)],0,'The sequence increases by 2 each time.')}
      else if(/analogy/.test(lo)){add(`Choose the pair with the same relationship as Bird : Nest.`,['Bee : Hive','Dog : Bark','Fish : Water','Horse : Grass'],0,'A nest is a dwelling associated with a bird; a hive is associated with a bee.')}
      else if(/ranking/.test(lo)){let top=5+(i%8),bottom=10+(i%7),total=top+bottom-1;add(`A student ranks ${top}th from the top and ${bottom}th from the bottom. How many students are there?`,[String(total),String(total+1),String(total-1),String(top+bottom)],0,`Total = ${top} + ${bottom} − 1 = ${total}.`)}
      else if(/classification/.test(lo)){add(`Which item does not belong with the others?`,['Apple','Mango','Carrot','Banana'],2,'Carrot is a vegetable; the other three are commonly classified as fruits.')} 
      else if(/syllogism/.test(lo)){add(`All engineers are graduates. Some graduates are athletes. Which conclusion is definitely true?`,['All engineers are graduates.','All engineers are athletes.','Some engineers are athletes.','No graduates are athletes.'],0,'The first premise directly establishes that all engineers are graduates.')} 
      else if(/seating|arrangement/.test(lo)){add(`P, Q and R sit in a row. P is left of Q and Q is left of R. Who is in the middle?`,['P','Q','R','Cannot determine'],1,'The order is P, Q, R, so Q is in the middle.')} 
      else if(/venn/.test(lo)){add(`In a Venn diagram, the overlapping region of sets A and B represents:`,['A ∩ B','A ∪ B','A − B','B − A'],0,'The intersection A ∩ B contains elements common to both sets.')} 
      else if(/non-verbal|mirror|water image|paper folding|figure matrix|cubes|dice/.test(lo)){add(`Which transformation is most directly tested by a mirror-image reasoning question?`,['Reflection across a mirror line','Addition of numbers','Sorting a list','Database normalization'],0,'Mirror-image reasoning tests geometric reflection across a line.')} 
      else if(/clock/.test(lo)){let h=1+(i%11);add(`A clock shows ${h}:00. What is the angle between the hands?`,[`${h*30}°`,`90°`,`60°`,`180°`],0,`At ${h}:00 the hour hand is ${h*30}° from 12 and the minute hand is at 12.`)}
      else if(/statement|conclusion|assumption|argument/.test(lo)){add(`All roses are flowers. Which conclusion is definitely true?`,['All roses are flowers.','All flowers are roses.','Some roses are not flowers.','No roses are flowers.'],0,'The conclusion repeats the stated premise exactly.')}
      else if(/history|geography|polity|science|computer|gk|static/.test(lo)){let data=[['first President of independent India',['Rajendra Prasad','Jawaharlal Nehru','Sardar Patel','B. R. Ambedkar'],0],['largest planet',['Jupiter','Earth','Mars','Venus'],0],['most abundant gas in Earth’s atmosphere',['Nitrogen','Oxygen','Carbon dioxide','Hydrogen'],0],['institution that conducts monetary policy in India',['RBI','SEBI','ISRO','UPSC'],0]];let d=data[i%data.length];add(`Which is the correct answer for ${d[0]}?`,d[1],d[2],`${d[1][d[2]]} is the correct answer for this fact.`)}
      else {add(`Which option is most directly related to ${t}?`,[`${t} concept`,`Unrelated topic`,`Opposite idea`,`Random fact`],0,`The first option directly names the selected ${t} topic.`)}
    }
  }
  return out;
}

function cancelPuzzle(){state.puzzle=null;openView('puzzles')}
function openPuzzle(t){
  const p={t,tries:0};
  if(t==='Sudoku'){p.grid=[[5,3,0,0,7,0,0,0,0],[6,0,0,1,9,5,0,0,0],[0,9,8,0,0,0,0,6,0],[8,0,0,0,6,0,0,0,3],[4,0,0,8,0,3,0,0,1],[7,0,0,0,2,0,0,0,6],[0,6,0,0,0,0,2,8,0],[0,0,0,4,1,9,0,0,5],[0,0,0,0,8,0,0,7,9]];p.solution=[[5,3,4,6,7,8,9,1,2],[6,7,2,1,9,5,3,4,8],[1,9,8,3,4,2,5,6,7],[8,5,9,7,6,1,4,2,3],[4,2,6,8,5,3,7,9,1],[7,1,3,9,2,4,8,5,6],[9,6,1,5,3,7,2,8,4],[2,8,7,4,1,9,6,3,5],[3,4,5,2,8,6,1,7,9]]}

  else if(t==='Number Puzzles'){p.prompt='2, 6, 12, 20, ?';p.answer='30';p.hint='Look at the increasing differences.'}
  else if(t==='Logical Puzzles'){p.prompt='All cats are animals. Some animals are black. Which is definitely true?';p.options=['All cats are animals.','All cats are black.','No cats are black.','Some cats are black.'];p.answer=0;p.hint='Use only what the first statement guarantees.'}
  else if(t==='Pattern Puzzles'){p.prompt='▲ ■ ▲ ■ ?';p.options=['▲','■','●','◆'];p.answer=0;p.hint='The two-symbol pattern alternates.'}
  else if(t==='Mathematical Puzzles'){p.prompt='If 3 + 4 = 25 and 2 + 5 = 29 using a²+b², what is 6 + 1?';p.answer='37';p.hint='Square both numbers and add.'}
  else if(t==='Sequence Puzzles'){p.prompt='3, 6, 12, 24, ?';p.answer='48';p.hint='Each term is multiplied by the same number.'}
  else if(t==='Matchstick Puzzles'){p.prompt='Move one matchstick to make 6 + 4 = 4 true. What should the left side become?';p.options=['8 - 4','6 - 2','5 + 1','4 + 4'];p.answer=0;p.hint='Change one operation or digit.'}
  else if(t==='Grid Puzzles'){p.prompt='In a 3×3 grid, each row must contain 1, 2, 3 once. If a row has 1 and 2, what is missing?';p.answer='3';p.hint='Each row uses every number exactly once.'}
  else if(t==='Seating Puzzles'){p.prompt='A, B and C sit in a row. A is left of B and B is left of C. Who is in the middle?';p.options=['A','B','C','Cannot determine'];p.answer=1;p.hint='Write the order from left to right.'}
  else if(t==='Brain Teasers'){p.prompt='What has keys but cannot open locks?';p.options=['A piano','A door','A map','A clock'];p.answer=0;p.hint='Think of an object with keys used to produce sound.'}
  else if(t==='Odd One Out'){p.prompt='Which is the odd one out?';p.options=['2','3','5','9'];p.answer=3;p.hint='Three are prime numbers.'}
  else if(t==='Visual Patterns'){p.prompt='○ □ ○ □ ?';p.options=['○','□','△','◇'];p.answer=0;p.hint='The shapes alternate.'}
  else if(t==='Magic Squares'){p.prompt='In a normal 3×3 magic square using 1–9, what is the magic sum?';p.answer='15';p.hint='The total of 1–9 is 45 and there are 3 rows.'}
  else if(t==='Cryptarithm'){p.prompt='If A=1 and B=2, what is the value of AB?';p.answer='12';p.hint='Read the assigned digits in order.'}
  else if(t==='Lateral Thinking'){p.prompt='A man walks into a room and sees three switches. Only one controls a lamp in another room. What is the key idea?';p.options=['Use different switch states and observe heat/light','Guess randomly','Turn all switches on forever','Ignore the lamp'];p.answer=0;p.hint='Use more than just whether the lamp is currently lit.'}
  else if(t==='Calendar Puzzles'){p.prompt='If today is Monday, what day is it after 14 days?';p.answer='Monday';p.hint='14 days equals two full weeks.'}
  else if(t==='Age Puzzles'){p.prompt='A father is 30 years older than his son. If the son is 12, how old is the father?';p.answer='42';p.hint='Add the age difference to the son’s age.'}
  else if(t==='Balance Puzzles'){p.prompt='If 2 identical boxes weigh 10 kg, what does one box weigh?';p.answer='5';p.hint='Divide the total equally.'}
  else {p.prompt=`Find the next term for ${t}: 10, 12, 14, ?`;p.answer='16';p.hint='Look for the simple pattern.'}
  state.puzzle=p;render();
}

function qFor(subject,type){
  if(type==='programming')return buildProgrammingQuestions(subject);
  if(type==='nonProgramming')return quizBank[subject]||buildCSQuestions(type,subject);
  if(type==='Aptitude'||type==='Verbal'||type==='Reasoning'||type==='GK')return buildTopicQuestions(type,subject);

}

function makeQuiz25(type,subject,mock){let base=qFor(subject,type);base=Array.isArray(base)&&base.length?base:genericBank;let offset=((Number(mock)||1)-1)*7%base.length;let ordered=base.map((_,i)=>base[(i+offset)%base.length]);let qs=Array.from({length:25},(_,i)=>{let q=ordered[i%ordered.length];return {question:q[0],options:[...q[1]],correct:q[2],explanation:q[3]}});return qs}
function quiz(){return `<div class="sectionHead"><div><div class="eyebrow">QUIZ ARENA</div><h1>Choose your quiz</h1><p class="muted">25 questions • 1 mark each • no negative marks • 25 minutes</p></div></div><div class="grid"><article class="card glass"><div class="icon">⌘</div><h3>I. Programming</h3><p>Subject-wise or all-programming mock tests.</p><button class="btn" onclick="quizSetup('programming','subject')">Programming Quiz — Subject Wise</button><button class="btn secondary" onclick="quizSetup('programming','mock')">Programming Quiz — Mock Test</button></article><article class="card glass"><div class="icon">Σ</div><h3>II. Non-Programming</h3><p>CSE subjects with subject-wise and mixed mocks.</p><button class="btn" onclick="quizSetup('nonProgramming','subject')">Non-Programming — Subject Wise</button><button class="btn secondary" onclick="quizSetup('nonProgramming','mock')">Non-Programming — Mock Test</button></article><article class="card glass"><div class="icon">⚡</div><h3>III. Mock Quiz</h3><p>25 questions combining programming and non-programming.</p><button class="btn" onclick="quizSetup('mixed','mock')">Start Full Mock Quiz</button></article></div>`}
function quizSetup(type,mode,subject){state.quiz=null;state.quizReview=false;state.quizSetup={type,mode,subject:subject||(type==='programming'?quizSubjects.programming[0]:type==='nonProgramming'?quizSubjects.nonProgramming[0]:type==='Aptitude'?'Aptitude':type==='Verbal'?'Verbal':type==='Reasoning'?'Reasoning':type==='GK'?'GK':'Mixed'),mockNo:1,returnView:type==='Aptitude'?'aptitude':(type==='Verbal'||type==='Reasoning')?'verbal':type==='GK'?'gk':'quiz'};render()}
function renderQuizSetup(){let s=state.quizSetup;if(!s)return quiz();let opts=s.type==='programming'?quizSubjects.programming:s.type==='nonProgramming'?quizSubjects.nonProgramming:[];let isSubject=s.mode==='subject';let title=s.type==='mixed'?'Full Mock Quiz':s.mode==='subject'?(s.type==='programming'?'Programming Quiz — Subject Wise':s.type==='nonProgramming'?'Non-Programming — Subject Wise':`${s.type} — Subject Wise`):(s.type==='programming'?'Programming Quiz — Mock Test':s.type==='nonProgramming'?'Non-Programming — Mock Test':`${s.type} — Mock Test`);return `<div class="quizBox glass"><div class="eyebrow">QUIZ INSTRUCTIONS</div><h1>${title}</h1>${isSubject&&s.type!=='mixed'&&opts.length?selector('Select subject',opts,s.subject,'setQuizSubject'):isSubject&&s.type!=='mixed'?`<div class="brief"><b>Selected topic</b><p>${esc(s.subject)}</p></div>`:''}${s.mode==='mock'&&s.type!=='mixed'&&s.type!=='Aptitude'&&s.type!=='Verbal'&&s.type!=='Reasoning'?selector('Mock quiz',Array.from({length:15},(_,i)=>'Mock Quiz '+(i+1)),'Mock Quiz '+s.mockNo,'setMockNo'):s.mode==='mock'&&['Aptitude','Verbal','Reasoning'].includes(s.type)?`<div class="brief"><b>Mock selection</b><p>Full ${esc(s.type)} placement mock</p></div>`:''}<div class="brief"><b>Instructions</b><ol><li>There will be 25 questions.</li><li>Each carries 1 mark.</li><li>No negative marks.</li><li>25 minutes total time.</li><li>You can move Previous/Next and review all answers before submission.</li></ol></div><div class="actions"><button class="btn" onclick="enterQuiz()">Start Quiz →</button><button class="btn secondary" onclick="cancelQuizSetup()">Cancel</button></div></div>`}
function setQuizSubject(v){state.quizSetup.subject=v;render()}function setMockNo(v){state.quizSetup.mockNo=Number(v.replace(/\D/g,''))||1;render()}
function cancelQuizSetup(){let v=state.quizSetup?.returnView||'quiz';state.quizSetup=null;state.quiz=null;openView(v)}
function enterQuiz(){let s=state.quizSetup,qs;if(!s)return;
  if(s.type==='mixed'){let p=quizSubjects.programming,n=quizSubjects.nonProgramming;qs=Array.from({length:25},(_,i)=>{let type=i%2===0?'programming':'nonProgramming',list=type==='programming'?p:n;return makeQuiz25(type,list[Math.floor(i/2)%list.length],s.mockNo)[i%25]});}
  else if(s.mode==='subject')qs=makeQuiz25(s.type,s.subject,1);

  state.quiz={...s,qs,idx:0,answers:Array(25).fill(null),finished:false,review:false,endTime:Date.now()+25*60*1000};state.quizSetup=null;render();startQuizClock()}
function openVerbalArea(type){state.verbalArea=type;state.search='';render()}
function practiceTopic(type,topic){let mapped=type==='Aptitude'?'Aptitude':type==='Current Affairs'?'Current Affairs':type==='GK'?'GK':type;let quizType=['Aptitude','Verbal','Reasoning','GK'].includes(mapped)?mapped:'nonProgramming';quizSetup(quizType,'subject',topic)}

function startQuiz(type){if(type==='Aptitude')quizSetup('Aptitude','mock','Aptitude');else if(type==='Verbal')quizSetup('Verbal','mock','Verbal');else if(type==='Reasoning')quizSetup('Reasoning','mock','Reasoning');else quizSetup('nonProgramming','mock')}

function app(){
  if(state.screen==='landing')return landing();
  if(state.screen==='auth')return auth();
  let quizRoute=['quiz','aptitude','verbal','gk'].includes(state.view);
  let content;
  if(quizRoute && state.quiz)content=renderQuiz();

}

 const canvas=document.getElementById('webglHero'); if(!canvas) return;

function buildThreeHero(){
 const canvas=document.getElementById('webglHero'); if(!canvas||!window.THREE)return;
 const T=window.THREE,scene=new T.Scene(); scene.fog=new T.FogExp2(0x02030a,.025);

 const world=new T.Group();scene.add(world);

 const ringColors=[0x64e9ff,0x9279ff,0x66ffcf,0xb59cff,0x64e9ff];
 for(let i=0;i<5;i++){const r=2.15+i*.55;const tor=new T.Mesh(new T.TorusGeometry(r,.012+i*.004,10,220),new T.MeshBasicMaterial({color:ringColors[i],transparent:true,opacity:.55,blending:T.AdditiveBlending}));tor.rotation.x=Math.PI/2+i*.3;tor.rotation.z=i*.62;tor.userData.speed=(i%2?-.0015:.0012)*(i+1);world.add(tor)}
 const symbols=['</>','{}','C','C++','JAVA','PYTHON','SQL','DSA','AI','WEB','API','OS','DBMS','GIT','JS','GO','RUST','KOTLIN'];
 symbols.forEach((txt,i)=>{const a=i/symbols.length*Math.PI*2;const radius=4.4+(i%3)*.75;const g=new T.Group();const plate=new T.Mesh(new T.PlaneGeometry(.9,.34),new T.MeshBasicMaterial({color:0x18224a,transparent:true,opacity:.7,side:T.DoubleSide}));g.add(plate);g.position.set(Math.cos(a)*radius,(Math.sin(i*1.7)*2.5),Math.sin(a)*radius-1);g.rotation.y=-a+.4;g.userData.a=a;g.userData.r=radius;g.userData.float=i*.8;world.add(g)});
 const pGeo=new T.BufferGeometry(),N=1700,pos=new Float32Array(N*3),vel=new Float32Array(N);for(let i=0;i<N;i++){const r=5+Math.random()*28,a=Math.random()*Math.PI*2;pos[i*3]=Math.cos(a)*r;pos[i*3+1]=(Math.random()-.5)*20;pos[i*3+2]=Math.sin(a)*r-4;vel[i]=.003+Math.random()*.012}pGeo.setAttribute('position',new T.BufferAttribute(pos,3));const pMat=new T.PointsMaterial({color:0x9ac8ff,size:.025,transparent:true,opacity:.7,blending:T.AdditiveBlending});const particles=new T.Points(pGeo,pMat);scene.add(particles);
 const grid=new T.GridHelper(80,40,0x283a80,0x111936);grid.position.y=-4.5;grid.rotation.x=.05;grid.material.transparent=true;grid.material.opacity=.14;scene.add(grid);
 const amb=new T.AmbientLight(0x7187ff,1.2);scene.add(amb);const l1=new T.PointLight(0x725cff,55,25);l1.position.set(4,3,7);scene.add(l1);const l2=new T.PointLight(0x00d9ff,45,24);l2.position.set(-5,-2,5);scene.add(l2);
 let tx=0,ty=0,cx=0,cy=0,down=false,lastX=0,lastY=0,spinX=0,spinY=0;const onPointer=e=>{tx=(e.clientX/innerWidth-.5);ty=(e.clientY/innerHeight-.5)};addEventListener('pointermove',onPointer);canvas.addEventListener('pointerdown',e=>{down=true;lastX=e.clientX;lastY=e.clientY});addEventListener('pointerup',()=>down=false);addEventListener('pointermove',e=>{if(down){spinY+=(e.clientX-lastX)*.006;spinX+=(e.clientY-lastY)*.004;lastX=e.clientX;lastY=e.clientY}});
 const stage=document.getElementById('brandStage');const brand=document.getElementById('brandMotion');function brandMove(e){if(!stage||!brand)return;const r=stage.getBoundingClientRect(),x=(e.clientX-(r.left+r.width/2))/r.width,y=(e.clientY-(r.top+r.height/2))/r.height;brand.style.transform=`rotateX(${(-y*8).toFixed(2)}deg) rotateY(${(x*12).toFixed(2)}deg) translateZ(18px)`}addEventListener('pointermove',brandMove);stage?.addEventListener('pointerleave',()=>{if(brand)brand.style.transform=''});
 function resize3(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize3);
 let t=0;function animate(){if(state.screen!=='landing'){threeStarted=false;removeEventListener('pointermove',onPointer);renderer.dispose();return}requestAnimationFrame(animate);t+=.01;cx+=(tx*1.1-cx)*.025;cy+=(ty*.55-cy)*.025;world.rotation.y+=((cx*.18)+spinY-world.rotation.y)*.035;world.rotation.x+=((-cy*.1)+spinX-world.rotation.x)*.035;spinX*=.985;spinY*=.985;core.rotation.x+=.003;core.rotation.y+=.006;wire.rotation.y-=.004;inner.rotation.x+=.005;world.children.forEach(o=>{if(o.userData.speed)o.rotation.z+=o.userData.speed;if(o.userData.a!==undefined){o.userData.a+=.0007*(o.userData.a%2>.9?1:-1);o.position.y+=Math.sin(t*1.5+o.userData.float)*.002}});particles.rotation.y+=.0007;camera.position.x+=(cx*.7-camera.position.x)*.018;camera.position.y+=(-cy*.4-camera.position.y)*.018;camera.position.z+=((12+Math.sin(t*.35)*.6)-camera.position.z)*.01;renderer.render(scene,camera)}animate();

const c=document.getElementById('space'),ctx=c.getContext('2d');let W,H,pts=[];function resize(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);pts=Array.from({length:Math.min(160,Math.floor(W/8))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.16,vy:(Math.random()-.5)*.16,z:Math.random(),r:Math.random()*1.4+.2}))}function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createRadialGradient(W*.5,H*.35,0,W*.5,H*.35,Math.max(W,H)*.72);g.addColorStop(0,'#101a43');g.addColorStop(.5,'#080d22');g.addColorStop(1,'#050816');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;ctx.fillStyle=`rgba(140,180,255,${.15+p.z*.7})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r+p.z,0,Math.PI*2);ctx.fill()}requestAnimationFrame(draw)}addEventListener('resize',resize);resize();draw();render();
